[project]
name = "character-bert"
version = "0.2.0"
description = "CharacterBERT models, pretraining, and fine-tuning utilities."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Hicham El Boukkouri" },
]
dependencies = [
    "torch>=2.12",
    "transformers>=5.9",
    "huggingface-hub>=1.16",
    "safetensors>=0.7",
    "numpy>=2.4",
    "requests>=2.34",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
]
finetuning = [
    "scikit-learn>=1.8",
    "datasets>=4.8",
    "evaluate>=0.4.6",
]
pretraining = [
    "datasets>=4.8",
    "accelerate>=1.13",
]
legacy-downloads = [
    "gdown>=6.0",
]

[project.scripts]
character-bert-download = "character_bert.cli:download"
character-bert-smoke-test = "character_bert.cli:smoke_test"
character-bert-finetune = "character_bert.finetuning.cli:main"
character-bert-pretrain = "character_bert.pretraining.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
